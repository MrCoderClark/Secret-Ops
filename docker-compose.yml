# ---------------------------------------------------------------------------
# SecretOps — local / single-host deployment.
#
# The default `docker compose up -d` brings up ONLY postgres. The app runs
# on your host via `pnpm dev` while you're building, which is the fastest
# edit loop and the one CLAUDE.md § Commands documents.
#
#   docker compose up -d                                 # postgres only
#   cd web && pnpm dev                                   # app on the host
#
# When you want to rehearse what Docker would actually ship — the Next.js
# standalone build inside the Alpine image with argon2 wired in — opt into
# the `full` profile. That's the production-style path.
#
#   docker compose --profile full up -d                       # postgres + app
#   docker compose exec app node_modules/.bin/prisma migrate deploy  # migrations
#   docker compose exec app tsx prisma/seed.ts                # optional demo data
#
# The invocations above call the Prisma CLI and tsx directly rather than via
# `pnpm prisma ...` / `pnpm db:seed`. In a Next.js standalone image the
# `pnpm` wrapper tries to verify the lockfile at runtime, corepack upgrades
# itself from the pinned 10 to latest, and overlayfs rejects the symlinks
# pnpm needs. Calling the binaries directly sidesteps the whole chain.
#
# This split exists so there's never a port :3000 fight between a container
# started by a previous session and the dev server you're trying to boot now.
#
# Secrets come from .env at this directory and are never baked into an image.
# The worker service lands in Milestone 6 (web/scripts/worker.ts); the compose
# file picks it up automatically once it exists.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretops}
      POSTGRES_DB: ${POSTGRES_DB:-secretops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secretops} -d ${POSTGRES_DB:-secretops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Opt-in only: `docker compose up -d` without --profile skips this
    # service, so postgres comes up but nothing fights pnpm dev for :3000.
    # Bring it up with `docker compose --profile full up -d`.
    profiles: ["full", "prod"]
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secretops}:${POSTGRES_PASSWORD:-secretops}@postgres:5432/${POSTGRES_DB:-secretops}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SECRETOPS_ROOT_KEYS: ${SECRETOPS_ROOT_KEYS:?SECRETOPS_ROOT_KEYS must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      # Override APP_PORT in .env when something else on the host already
      # holds 3000 (a stray `pnpm dev`, a dashboard tool, etc.) — compose
      # fast-fails on bind conflicts, so routing around them beats hunting.
      - "${APP_PORT:-3000}:3000"

  worker:
    # Same opt-in profiles as `app` — the worker belongs with the full-stack
    # path, not hybrid dev (where `pnpm worker` on the host is the right loop).
    profiles: ["full", "prod"]
    # Reuses the app image; we only override the entrypoint. The Dockerfile's
    # runner stage carries scripts/, lib/ and tsx so this just works.
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secretops}:${POSTGRES_PASSWORD:-secretops}@postgres:5432/${POSTGRES_DB:-secretops}?schema=public
      SECRETOPS_ROOT_KEYS: ${SECRETOPS_ROOT_KEYS:?SECRETOPS_ROOT_KEYS must be set}
      # Override these to run the sweeps faster in staging; defaults in
      # scripts/worker.ts are 6h (rotation) and 30m (drift).
      ROTATION_SWEEP_MS: ${ROTATION_SWEEP_MS:-}
      DRIFT_SWEEP_MS: ${DRIFT_SWEEP_MS:-}
      NODE_ENV: production
    command: ["tsx", "scripts/worker.ts"]

volumes:
  postgres-data:
