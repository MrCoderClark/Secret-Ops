# ---------------------------------------------------------------------------
# SecretOps — local / single-host deployment.
#
#   docker compose up -d                                 # postgres + app
#   docker compose exec app pnpm prisma migrate deploy   # apply migrations
#   docker compose exec app pnpm db:seed                 # optional demo data
#
# For day-to-day development, run just Postgres in a container and keep the
# app on the host (faster iteration, native node_modules):
#
#   docker compose up -d postgres
#   cd web && pnpm dev
#
# Secrets come from .env at this directory and are never baked into an image.
# The worker service lands in Milestone 6 (web/scripts/worker.ts); the compose
# file picks it up automatically once it exists.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretops}
      POSTGRES_DB: ${POSTGRES_DB:-secretops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secretops} -d ${POSTGRES_DB:-secretops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secretops}:${POSTGRES_PASSWORD:-secretops}@postgres:5432/${POSTGRES_DB:-secretops}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SECRETOPS_ROOT_KEYS: ${SECRETOPS_ROOT_KEYS:?SECRETOPS_ROOT_KEYS must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      # Override APP_PORT in .env when something else on the host already
      # holds 3000 (a stray `pnpm dev`, a dashboard tool, etc.) — compose
      # fast-fails on bind conflicts, so routing around them beats hunting.
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
